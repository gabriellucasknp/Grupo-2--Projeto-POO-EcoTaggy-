[build]
builder = "NIXPACKS"
buildCommand = "cd ecoTaggy-backend && chmod +x mvnw && ./mvnw clean package -DskipTests"

[deploy]
startCommand = "java -jar ecoTaggy-backend/target/ecoTaggy-backend-0.0.1-SNAPSHOT.jar"
healthcheckPath = "/"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
