<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - EcoTaggy</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-gray-50 dark:bg-slate-950 flex items-center justify-center min-h-screen transition-colors duration-300">
    <div class="bg-white dark:bg-slate-900 p-8 rounded-3xl shadow-xl max-w-md w-full border border-gray-100 dark:border-slate-800">
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-16 h-16 bg-green-100 dark:bg-green-900/30 rounded-full mb-4">
                <i data-lucide="leaf" class="w-8 h-8 text-green-600 dark:text-green-400"></i>
            </div>
            <h2 class="text-3xl font-bold text-gray-900 dark:text-white">Bem-vindo de volta</h2>
            <p class="text-gray-500 dark:text-gray-400 mt-2">Acesse sua conta na EcoTaggy</p>
        </div>
        
        <div th:if="${param.erro}" class="mb-6 p-4 bg-red-50 dark:bg-red-900/20 border border-red-200 dark:border-red-800 text-red-600 dark:text-red-400 rounded-xl text-sm flex items-center">
            <i data-lucide="alert-circle" class="w-5 h-5 mr-2"></i> Credenciais inválidas. Tente novamente.
        </div>
        
        <div th:if="${param.logout}" class="mb-6 p-4 bg-blue-50 dark:bg-blue-900/20 border border-blue-200 dark:border-blue-800 text-blue-600 dark:text-blue-400 rounded-xl text-sm flex items-center">
            <i data-lucide="info" class="w-5 h-5 mr-2"></i> Você saiu da sua conta com segurança.
        </div>

        <form th:action="@{/login}" method="POST" class="space-y-6">
            <div>
                <label class="block text-sm font-bold text-gray-700 dark:text-gray-300 mb-2">E-mail Corporativo</label>
                <input type="email" name="email" required class="w-full px-4 py-3 rounded-xl border border-gray-200 dark:border-slate-700 bg-gray-50 dark:bg-slate-800 dark:text-white focus:ring-2 focus:ring-green-500 outline-none transition-all" placeholder="seu@email.com">
            </div>
            <div>
                <label class="block text-sm font-bold text-gray-700 dark:text-gray-300 mb-2">Senha</label>
                <input type="password" name="senha" required class="w-full px-4 py-3 rounded-xl border border-gray-200 dark:border-slate-700 bg-gray-50 dark:bg-slate-800 dark:text-white focus:ring-2 focus:ring-green-500 outline-none transition-all" placeholder="••••••••">
            </div>
            <button type="submit" class="w-full py-4 bg-green-600 hover:bg-green-700 text-white font-bold rounded-xl transition-all shadow-lg shadow-green-200 dark:shadow-none active:scale-95">
                Entrar no Sistema
            </button>
        </form>
        
        <div class="mt-8 text-center text-sm text-gray-500 dark:text-gray-400 border-t border-gray-100 dark:border-slate-800 pt-6">
            Não possui acesso? <a th:href="@{/cadastro}" class="text-green-600 dark:text-green-400 font-bold hover:underline">Solicite um convite</a>
            <div class="mt-4"><a th:href="@{/landing}" class="text-gray-400 hover:text-gray-600 dark:hover:text-gray-300 font-medium">← Voltar à Tela Inicial</a></div>
        </div>
    </div>
    <script>
        lucide.createIcons();
    </script>
</body>
</html>
