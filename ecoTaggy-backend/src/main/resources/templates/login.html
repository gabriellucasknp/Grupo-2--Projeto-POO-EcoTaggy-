<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Eco Taggy</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-gray-50 font-sans antialiased text-gray-900 min-h-screen flex">

    <div class="w-full lg:w-1/2 flex flex-col justify-center px-8 sm:px-16 md:px-24 py-12 bg-white relative">
        
        <a href="/" class="absolute top-8 left-8 flex items-center text-gray-500 hover:text-green-600 transition-colors font-medium">
            <i data-lucide="arrow-left" class="w-5 h-5 mr-2"></i>
            Voltar
        </a>

        <div class="max-w-md w-full mx-auto mt-8 animate-in fade-in duration-500">
            <h2 class="text-3xl font-bold text-gray-900 mb-8">Login</h2>

            <form action="/landing" method="GET" class="space-y-5">
                
                <div class="space-y-1">
                    <input type="email" id="email" required placeholder="E-mail *" 
                           class="block w-full px-4 h-14 border border-gray-300 rounded-lg focus:ring-green-500 focus:border-green-500 font-medium text-sm outline-none transition-colors">
                </div>

                <div class="space-y-1">
                    <input type="password" id="password" required placeholder="Senha *" 
                           class="block w-full px-4 h-14 border border-gray-300 rounded-lg focus:ring-green-500 focus:border-green-500 font-medium text-sm outline-none transition-colors">
                </div>

                <div class="flex items-center justify-between pt-2">
                    <button type="submit" class="flex justify-center items-center h-12 px-8 rounded-lg shadow-md text-[13px] font-bold text-white bg-green-600 hover:bg-green-700 transition-colors tracking-wide">
                        LOGIN 
                        <i data-lucide="arrow-right" class="w-4 h-4 ml-2"></i>
                    </button>

                    <a href="#" class="text-xs font-medium text-gray-600 hover:text-gray-900 transition-colors">
                        Esqueceu sua senha?
                    </a>
                </div>

                <div class="pt-6 relative">
                    <a href="/cadastro" class="flex justify-center items-center w-full h-12 border-2 border-gray-200 rounded-lg bg-white text-gray-700 hover:bg-gray-50 font-bold text-xs tracking-wider transition-colors">
                        CRIAR UMA NOVA CONTA
                    </a>
                    
                    <div class="absolute top-4 right-4 bg-pink-600 text-white text-[10px] font-bold px-2 py-0.5 rounded-full z-10 flex items-center shadow-sm">
                        Beta
                    </div>
                </div>
            </form>
        </div>
    </div>

    <div class="hidden lg:flex w-1/2 bg-green-700 justify-center items-center relative overflow-hidden">
        <div class="absolute inset-0 opacity-10">
            <svg class="h-full w-full" xmlns="http://www.w3.org/2000/svg" id="patternId" x="0" y="0" width="40" height="40" viewBox="0 0 40 40"><path d="M0 0h40v40H0z" fill="none"/><path d="M20 0l20 20-20 20L0 20z" fill="currentColor"/></svg>
        </div>
        
        <div class="relative z-10 text-center px-12 text-white max-w-lg">
            <div class="bg-white/20 p-4 rounded-2xl inline-block mb-8 backdrop-blur-sm">
                <i data-lucide="leaf" class="w-16 h-16 text-white"></i>
            </div>
            <h3 class="text-4xl font-bold mb-6 leading-tight">Bem-vindo de volta!</h3>
            <p class="text-green-100 text-lg leading-relaxed">
                Acesse seu painel para continuar monitorando as métricas ESG da sua operação com a Eco Taggy.
            </p>
        </div>
    </div>

    <script>
        lucide.createIcons();
    </script>
</body>
</html>
