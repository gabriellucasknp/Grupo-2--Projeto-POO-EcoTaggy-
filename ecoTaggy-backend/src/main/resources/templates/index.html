<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Eco Taggy | Home</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-50 font-sans text-slate-900">
    <nav class="flex items-center justify-between px-8 py-6 bg-white border-b border-slate-200">
        <div class="flex items-center gap-3 py-1">
            <img src="/images/logo1.png" alt="Eco Taggy Logo" class="h-16 w-auto object-contain"> 
        </div>
        <div class="flex gap-4">
            <a href="/login" class="px-5 py-2 font-medium text-slate-600 hover:text-green-600">Entrar</a>
            <a href="/cadastro" class="px-6 py-2 bg-green-600 text-white rounded-lg font-bold hover:bg-green-700 transition">Criar Conta</a>
        </div>
    </nav>

    <main class="max-w-4xl mx-auto px-8 py-24 text-center">
        <h1 class="text-5xl font-extrabold mb-6 leading-tight">Mensure sua pegada de <span class="text-green-600 italic">carbono digital.</span></h1>
        <p class="text-xl text-slate-600 mb-12 max-w-2xl mx-auto">Sua frota mais sustentável com monitoramento em tempo real. Cadastre-se para acessar o portal completo.</p>
        
        <a href="/cadastro" class="inline-flex items-center gap-2 px-8 py-4 bg-green-600 text-white rounded-xl font-bold text-lg hover:bg-green-700 shadow-lg shadow-green-200">
            Começar Agora <i data-lucide="arrow-right"></i>
        </a>
    </main>

    <script>lucide.createIcons();</script>
</body>
</html>
