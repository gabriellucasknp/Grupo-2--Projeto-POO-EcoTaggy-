<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Perfil - EcoTaggy</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }
        tailwind.config = { darkMode: 'class' }
    </script>
</head>
<body class="min-h-screen bg-gray-50 dark:bg-slate-950 text-gray-900 dark:text-gray-100 transition-colors duration-300">


    <header class="sticky top-0 z-50 backdrop-blur-md border-b bg-white/80 border-green-100 dark:bg-slate-900/80 dark:border-slate-800">
        <div class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between">
            <div class="flex items-center gap-2">
                <a th:href="@{/landing}"><img src="/images/logo1.png" alt="Logo" class="h-16 w-auto dark:brightness-110"></a>
            </div>
            <nav class="flex items-center gap-4">
                <a th:href="@{/landing}" class="text-sm font-medium text-gray-500 hover:text-green-600 flex items-center">
                    <i data-lucide="arrow-left" class="w-4 h-4 mr-1"></i> Voltar ao Início
                </a>
            </nav>
        </div>
    </header>


    <main class="max-w-4xl mx-auto px-6 py-12">
        <div class="mb-8">
            <h1 class="text-3xl font-bold dark:text-white">Configurações de Perfil</h1>
            <p class="text-gray-600 dark:text-gray-400">Gerencie suas informações pessoais e segurança da conta.</p>
        </div>


        <div th:if="${param.sucesso}" class="mb-6 p-4 bg-green-100 border border-green-200 text-green-700 rounded-xl flex items-center animate-in">
            <i data-lucide="check-circle" class="w-5 h-5 mr-2"></i>
            Perfil atualizado com sucesso!
        </div>


        <div class="bg-white dark:bg-slate-900 rounded-3xl shadow-xl border border-gray-100 dark:border-slate-800 overflow-hidden">
            <form th:action="@{/perfil/atualizar}" method="POST" enctype="multipart/form-data" class="p-8 space-y-8">
                <input type="hidden" name="id" th:value="${usuario.id}">


                <div class="flex flex-col md:flex-row items-center gap-8 pb-8 border-b dark:border-slate-800">
                    <div class="relative group">
                        <img th:src="${usuario.fotoUrl != null && !usuario.fotoUrl.isEmpty() ? usuario.fotoUrl : 'https://images.unsplash.com/photo-1603775493298-e06a5f21e46c?q=80&w=200'}"
                             id="preview-img" alt="Avatar" class="w-28 h-28 rounded-full object-cover border-4 border-green-500 shadow-lg transition-transform group-hover:scale-105">
                        <div class="absolute inset-0 flex items-center justify-center bg-black/40 rounded-full opacity-0 group-hover:opacity-100 transition-opacity cursor-pointer">
                            <i data-lucide="camera" class="text-white w-6 h-6"></i>
                        </div>
                    </div>
                    <div class="flex-1 w-full">
                        <label class="block text-sm font-bold text-gray-500 dark:text-gray-400 mb-2 uppercase tracking-wider">Foto de Perfil</label>
                        <input type="file" name="imagemArquivo" id="file-input" accept="image/*"
                            class="w-full px-4 py-3 rounded-xl border border-gray-200 dark:bg-slate-800 dark:border-slate-700 focus:ring-2 focus:ring-green-500 outline-none transition-all
                            file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-green-50 file:text-green-700 hover:file:bg-green-100">
                    </div>
                </div>


                <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                    <div>
                        <label class="block text-sm font-bold text-gray-500 dark:text-gray-400 mb-2 uppercase tracking-wider">Nome Completo</label>
                        <input type="text" name="nome" th:value="${usuario.nome}" required
                               class="w-full px-4 py-3 rounded-xl border border-gray-200 dark:bg-slate-800 dark:border-slate-700 focus:ring-2 focus:ring-green-500 outline-none transition-all">
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-gray-500 dark:text-gray-400 mb-2 uppercase tracking-wider">E-mail (Inalterável)</label>
                        <input type="email" th:value="${usuario.email}" readonly
                               class="w-full px-4 py-3 rounded-xl border border-gray-100 bg-gray-50 dark:bg-slate-950 dark:border-slate-800 text-gray-400 cursor-not-allowed outline-none">
                    </div>
                </div>


                <div class="pt-4">
                    <h3 class="text-lg font-bold mb-4 flex items-center">
                        <i data-lucide="shield-check" class="w-5 h-5 mr-2 text-green-600"></i> Segurança
                    </h3>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                        <div>
                            <label class="block text-sm font-bold text-gray-500 dark:text-gray-400 mb-2 uppercase tracking-wider">Nova Senha</label>
                            <input type="password" name="novaSenha" placeholder="Digite apenas se quiser mudar"
                                   class="w-full px-4 py-3 rounded-xl border border-gray-200 dark:bg-slate-800 dark:border-slate-700 focus:ring-2 focus:ring-green-500 outline-none transition-all">
                        </div>
                        <div class="flex items-end">
                            <p class="text-xs text-gray-500 dark:text-gray-400 bg-gray-100 dark:bg-slate-800/50 p-4 rounded-xl">
                                <strong>Dica:</strong> Use senhas fortes com números e caracteres especiais para proteger seus dados ambientais.
                            </p>
                        </div>
                    </div>
                </div>


                <div class="flex items-center justify-end gap-4 pt-6">
                    <button type="reset" class="px-6 py-3 font-medium text-gray-500 hover:text-gray-800 dark:hover:text-white transition-colors">
                        Descartar
                    </button>
                    <button type="submit" class="px-10 py-4 bg-green-600 text-white rounded-xl font-bold hover:bg-green-700 transition-all shadow-lg shadow-green-200 dark:shadow-none active:scale-95">
                        Salvar Configurações
                    </button>
                </div>
            </form>
        </div>
    </main>


    <script>
        lucide.createIcons();


        // Lógica de Preview de Arquivo Local
        const fileInput = document.getElementById('file-input');
        const previewImg = document.getElementById('preview-img');


        fileInput.addEventListener('change', function() {
            const file = this.files[0];
           
            if (file) {
                if (!file.type.startsWith('image/')) {
                    alert("Por favor, selecione um arquivo de imagem válido.");
                    return;
                }


                const reader = new FileReader();


                reader.onload = function(e) {
                    previewImg.src = e.target.result;
                };


                reader.readAsDataURL(file);
            }
        });
    </script>
</body>
</html>
