<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Erro no Sistema - EcoTaggy</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 flex items-center justify-center h-screen">
    <div class="max-w-xl bg-white p-8 rounded-lg shadow-md border-l-4 border-red-500">
        <h1 class="text-2xl font-bold text-red-600 mb-4">Ops! Ocorreu um erro ao carregar a página.</h1>
        
        <p class="text-gray-700 font-semibold mb-2" th:text="${mensagemErro}">Desculpe, ocorreu um erro interno.</p>
        
        <!-- Caixa para mostrar o motivo técnico do erro e facilitar a resolução -->
        <div class="bg-gray-100 p-4 rounded text-sm text-red-800 font-mono overflow-auto mb-6">
            <p th:text="${detalheErro}">Detalhe não disponível.</p>
        </div>
        
        <a href="/" class="bg-green-600 hover:bg-green-700 text-white font-bold py-2 px-4 rounded">
            Voltar para o Início
        </a>
    </div>
</body>
</html>
