# 1. Nome do projeto
spring.application.name=ecoTaggy-backend

# 2. Configuração portável para local e deploy
# Em deploy, é possível sobrescrever a URL do banco com SPRING_DATASOURCE_URL ou DATABASE_URL.
# Sem configuração externa, a aplicação usa H2 em memória para subir sem dependências adicionais.
spring.datasource.url=${SPRING_DATASOURCE_URL:${DATABASE_URL:jdbc:h2:mem:ecotaggydb;DB_CLOSE_DELAY=-1;MODE=MySQL}}
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# 3. Console do Banco
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# 4. Sincronização e Logs
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# 5. Porta
server.port=${PORT:8080}

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
