# 1. Nome do projeto
spring.application.name=ecoTaggy-backend

# 2. Configuração portável para local e deploy
# Em deploy, use DATABASE_URL e PORT se a plataforma exigir.
# Localmente, o banco continua em arquivo, agora com caminho relativo ao projeto.
spring.datasource.url=${DATABASE_URL:jdbc:h2:file:./data/ecotaggydb;DB_CLOSE_DELAY=-1;MODE=MySQL;AUTO_SERVER=TRUE}
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# 3. Console do Banco
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# 4. Sincronização e Logs
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# 5. Porta
server.port=${PORT:8081}

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
