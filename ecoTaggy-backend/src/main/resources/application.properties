# 1. Nome do projeto
spring.application.name=ecoTaggy-backend

# 2. Configuração correta para Windows (H2 em Memória)
# Adicionado AUTO_SERVER=TRUE para evitar o erro "Database may be already in use"
spring.datasource.url=jdbc:h2:file:C:/temp/ecotaggydb;DB_CLOSE_DELAY=-1;MODE=MySQL;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# 3. Console do Banco (Para você testar em http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# 4. Sincronização e Logs
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# 5. Porta (mudei para 8081 para garantir que não haja conflito)
server.port=8081

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB